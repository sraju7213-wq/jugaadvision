<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description"
        content="Jugaad Visuals: An all-in-one AI toolkit for creators. Generate images, edit photos, and craft professional prompts with our smart AI workbench." />
    <meta name="keywords"
        content="AI image generator, prompt engineering, AI editor, background remover, stable diffusion, midjourney, dall-e" />
    <title>Jugaad Visuals - Smart AI Creative Studio</title>
    
    <!-- PWA Support -->
    <meta name="theme-color" content="#050505" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Google Fonts - Optimized Loading -->
    <!-- Google Fonts - Optimized Loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Preload critical fonts for faster rendering -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#7c3aed", // Electric Violet
                        "background-light": "#f0f2f5",
                        "background-dark": "#050505", // Deepest Black (Aurora Base)

                        // Mapping old semantic names to new palette for compatibility
                        "md-primary": "#7c3aed",
                        "md-on-primary": "#ffffff",
                        "md-surface": "var(--bg-color)",
                        "md-on-surface": "var(--text-main)",
                        "md-on-surface-variant": "var(--text-muted)",

                        // Glassmorphism utilities
                        glass: "rgba(255, 255, 255, 0.05)",
                        "glass-hover": "rgba(255, 255, 255, 0.1)",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                    },
                    backgroundImage: {
                        "gradient-cta":
                            "linear-gradient(to right, #3b82f6, #8b5cf6)",
                        "text-gradient":
                            "linear-gradient(to right, #3b82f6, #8b5cf6)",
                    },
                    animation: {
                        "slide-up-fade":
                            "slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        shimmer: "shimmer 2s linear infinite",
                        breathing: "breathing 3s ease-in-out infinite",
                        "pop-in": "popIn 0.3s ease-out forwards",

                        // Aurora Animations
                        "aurora-blob-1":
                            "auroraBlob1 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)",
                        "aurora-blob-2":
                            "auroraBlob2 30s infinite alternate-reverse cubic-bezier(0.4, 0, 0.2, 1)",
                        "aurora-blob-3":
                            "auroraBlob3 35s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)",
                    },
                    keyframes: {
                        slideUpFade: {
                            "0%": {
                                transform: "translateY(20px)",
                                opacity: "0",
                            },
                            "100%": {
                                transform: "translateY(0)",
                                opacity: "1",
                            },
                        },
                        shimmer: {
                            "0%": { backgroundPosition: "200% 0" },
                            "100%": { backgroundPosition: "-200% 0" },
                        },
                        breathing: {
                            "0%, 100%": {
                                opacity: "1",
                                transform: "scale(1)",
                            },
                            "50%": {
                                opacity: "0.85",
                                transform: "scale(0.98)",
                            },
                        },
                        popIn: {
                            "0%": { transform: "scale(0.5)", opacity: "0" },
                            "70%": {
                                transform: "scale(1.1)",
                                opacity: "1",
                            },
                            "100%": { transform: "scale(1)", opacity: "1" },
                        },
                        // Complex 3D Floating Motion - Optimized
                        auroraBlob1: {
                            "0%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                            "33%": {
                                transform:
                                    "translate3d(10%, 10%, 0) scale(1.1)",
                            },
                            "66%": {
                                transform:
                                    "translate3d(-5%, 20%, 0) scale(0.9)",
                            },
                            "100%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                        },
                        auroraBlob2: {
                            "0%": {
                                transform:
                                    "translate3d(0, 0, 0) rotate(0deg)",
                            },
                            "50%": {
                                transform:
                                    "translate3d(-10%, -10%, 0) rotate(10deg)",
                            },
                            "100%": {
                                transform:
                                    "translate3d(0, 0, 0) rotate(0deg)",
                            },
                        },
                        auroraBlob3: {
                            "0%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                            "50%": {
                                transform:
                                    "translate3d(15%, -15%, 0) scale(1.2)",
                            },
                            "100%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                        },
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --bg-color: transparent;
            --text-main: #1f2937;
            --text-muted: #6b7280;
        }

        .dark {
            --bg-color: transparent;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        /* GPU Acceleration for smooth animations */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        /* Optimize transitions - only animate transform and opacity */
        button,
        a,
        [role="button"] {
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            backface-visibility: hidden;
        }

        button:hover,
        a:hover,
        [role="button"]:hover {
            transform: translateY(-1px);
        }

        button:active,
        a:active,
        [role="button"]:active {
            transform: translateY(0);
        }

        .text-gradient {
            background-image: linear-gradient(to right, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .aurora-blob {
            will-change: transform;
            contain: layout style paint;
        }

        /* Optimized card transitions */
        .glass-card,
        [class*="rounded-3xl"],
        [class*="rounded-2xl"] {
            will-change: transform;
            transform: translateZ(0);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.25);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.5);
        }

        /* Shimmer animation for loading states */
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .animate-shimmer {
            animation: shimmer 2s linear infinite;
            background-size: 200% 100%;
        }
        
        /* Mobile Performance Optimizations */
        @media (max-width: 768px) {
            /* Disable heavy aurora animations on mobile */
            .aurora-blob {
                animation: none !important;
                filter: blur(60px) !important;
                opacity: 0.3 !important;
            }
            
            /* Reduce backdrop-filter intensity on mobile */
            [class*="backdrop-blur"] {
                backdrop-filter: blur(8px) !important;
                -webkit-backdrop-filter: blur(8px) !important;
            }
        }
        
        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .aurora-blob {
                animation: none !important;
            }
        }
        
        /* Accessibility focus indicators */
        :focus-visible {
            outline: 2px solid #7c3aed;
            outline-offset: 2px;
        }
        
        /* Skip to content link */
        .skip-to-content {
            position: absolute;
            left: -9999px;
            z-index: 9999;
            padding: 1em;
            background-color: #7c3aed;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .skip-to-content:focus {
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }
    </style>
    <script type="importmap">
            {
                "imports": {
                    "react": "https://aistudiocdn.com/react@^19.2.0/index.js",
                    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0/index.js",
                    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client.js",
                    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
                    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
                    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
                    "react/": "https://aistudiocdn.com/react@^19.2.0/"
                }
            }
        </script>
    <link rel="stylesheet" href="/index.css" />
</head>

<body class="font-display antialiased overflow-x-hidden selection:bg-purple-500 selection:text-white">
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>
    
    <!-- The Aurora Background System -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none bg-background-light dark:bg-[#050505]">
        <!-- Energy Layer: 3D Blurred Orbs -->
        <div class="absolute w-full h-full">
            <!-- Orb 1: Electric Blue / Cyan (Top Left) -->
            <div
                class="aurora-blob absolute top-[-10%] left-[-10%] w-[60vw] h-[60vw] bg-blue-600/30 dark:bg-blue-600/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[80px] opacity-60 animate-aurora-blob-1 will-change-transform">
            </div>

            <!-- Orb 2: Cyberpunk Purple (Bottom Right) -->
            <div
                class="aurora-blob absolute bottom-[-10%] right-[-10%] w-[60vw] h-[60vw] bg-purple-600/30 dark:bg-purple-600/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[80px] opacity-60 animate-aurora-blob-2 will-change-transform">
            </div>

            <!-- Orb 3: Hot Pink (Center/Floating) -->
            <div
                class="aurora-blob absolute top-[20%] left-[30%] w-[40vw] h-[40vw] bg-pink-600/30 dark:bg-pink-600/20 rounded-full mix-blend-multiply dark:mix-blend-screen filter blur-[70px] opacity-50 animate-aurora-blob-3 will-change-transform">
            </div>

            <!-- Orb 4: Cyan Accent (Specific for high contrast) -->
            <div class="aurora-blob absolute bottom-[20%] left-[10%] w-[30vw] h-[30vw] bg-cyan-500/20 dark:bg-cyan-500/10 rounded-full mix-blend-screen filter blur-[60px] opacity-40 animate-aurora-blob-1 will-change-transform"
                style="animation-delay: -5s"></div>
        </div>

        <!-- Optional: Subtle Noise Texture for "Film Grain" feel (Optional, adds realism) -->
        <div class="absolute inset-0 opacity-[0.03] dark:opacity-[0.05]" style="
                    background-image: url(&quot;data:image/svg+xml,%3Csvg viewBox=%220 0 200 200%22 xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter id=%22noise%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%220.65%22 numOctaves=%223%22 stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect width=%22100%25%22 height=%22100%25%22 filter=%22url(%23noise)%22 opacity=%221%22/%3E%3C/svg%3E&quot;);
                "></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
