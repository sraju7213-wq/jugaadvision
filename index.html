<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description"
        content="Jugaad Visuals: An all-in-one AI toolkit for creators. Craft professional prompts with our smart AI workbench." />
    <meta name="keywords"
        content="AI image generator, prompt engineering, AI editor, background remover, stable diffusion, midjourney, dall-e" />
    <title>Jugaad Visuals - Smart AI Creative Studio</title>
    
    <!-- PWA Support -->
    <link rel="apple-touch-icon" href="/pwa-192x192.png">
    <link rel="manifest" href="/manifest.webmanifest">

    <!-- Use the system font stack for stable metrics and zero font-request render delay. -->

    <!-- Tailwind utilities are compiled at build time into /styles.css. -->
    <script type="application/json" id="legacy-tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#7c3aed", // Electric Violet
                        "background-light": "#f0f2f5",
                        "background-dark": "#050505", // Deepest Black (Aurora Base)

                        // Mapping old semantic names to new palette for compatibility
                        "md-primary": "#7c3aed",
                        "md-on-primary": "#ffffff",
                        "md-surface": "var(--bg-color)",
                        "md-on-surface": "var(--text-main)",
                        "md-on-surface-variant": "var(--text-muted)",

                        // Glassmorphism utilities
                        glass: "rgba(255, 255, 255, 0.05)",
                        "glass-hover": "rgba(255, 255, 255, 0.1)",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        display: ["Inter", "sans-serif"],
                    },
                    backgroundImage: {
                        "gradient-cta":
                            "linear-gradient(to right, #3b82f6, #8b5cf6)",
                        "text-gradient":
                            "linear-gradient(to right, #3b82f6, #8b5cf6)",
                    },
                    animation: {
                        "slide-up-fade":
                            "slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards",
                        shimmer: "shimmer 2s linear infinite",
                        breathing: "breathing 3s ease-in-out infinite",
                        "pop-in": "popIn 0.3s ease-out forwards",

                        // Aurora Animations
                        "aurora-blob-1":
                            "auroraBlob1 25s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)",
                        "aurora-blob-2":
                            "auroraBlob2 30s infinite alternate-reverse cubic-bezier(0.4, 0, 0.2, 1)",
                        "aurora-blob-3":
                            "auroraBlob3 35s infinite alternate cubic-bezier(0.4, 0, 0.2, 1)",
                    },
                    keyframes: {
                        slideUpFade: {
                            "0%": {
                                transform: "translateY(20px)",
                                opacity: "0",
                            },
                            "100%": {
                                transform: "translateY(0)",
                                opacity: "1",
                            },
                        },
                        shimmer: {
                            "0%": { backgroundPosition: "200% 0" },
                            "100%": { backgroundPosition: "-200% 0" },
                        },
                        breathing: {
                            "0%, 100%": {
                                opacity: "1",
                                transform: "scale(1)",
                            },
                            "50%": {
                                opacity: "0.85",
                                transform: "scale(0.98)",
                            },
                        },
                        popIn: {
                            "0%": { transform: "scale(0.5)", opacity: "0" },
                            "70%": {
                                transform: "scale(1.1)",
                                opacity: "1",
                            },
                            "100%": { transform: "scale(1)", opacity: "1" },
                        },
                        // Complex 3D Floating Motion - Optimized
                        auroraBlob1: {
                            "0%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                            "33%": {
                                transform:
                                    "translate3d(10%, 10%, 0) scale(1.1)",
                            },
                            "66%": {
                                transform:
                                    "translate3d(-5%, 20%, 0) scale(0.9)",
                            },
                            "100%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                        },
                        auroraBlob2: {
                            "0%": {
                                transform:
                                    "translate3d(0, 0, 0) rotate(0deg)",
                            },
                            "50%": {
                                transform:
                                    "translate3d(-10%, -10%, 0) rotate(10deg)",
                            },
                            "100%": {
                                transform:
                                    "translate3d(0, 0, 0) rotate(0deg)",
                            },
                        },
                        auroraBlob3: {
                            "0%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                            "50%": {
                                transform:
                                    "translate3d(15%, -15%, 0) scale(1.2)",
                            },
                            "100%": {
                                transform: "translate3d(0, 0, 0) scale(1)",
                            },
                        },
                    },
                },
            },
        };
    </script>
    <style>
        :root {
            --bg-color: #f4f1ec;
            --text-main: #17171b;
            --text-muted: #6d6b70;
        }

        .dark {
            --bg-color: #0c0d11;
            --text-main: #f7f4ef;
            --text-muted: #aaa8ad;
        }

        /* GPU Acceleration for smooth animations */
        * {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            transition:
                background-color 0.3s ease,
                color 0.3s ease;
        }

        /* Optimize transitions - only animate transform and opacity */
        button,
        a,
        [role="button"] {
            transition: transform 0.2s ease, opacity 0.2s ease, box-shadow 0.2s ease;
            backface-visibility: hidden;
        }

        button:hover,
        a:hover,
        [role="button"]:hover {
            transform: translateY(-1px);
        }

        button:active,
        a:active,
        [role="button"]:active {
            transform: translateY(0);
        }

        .text-gradient {
            color: inherit;
        }

        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .aurora-blob {
            will-change: transform;
            contain: layout style paint;
        }

        /* Optimized card transitions */
        .glass-card,
        [class*="rounded-3xl"],
        [class*="rounded-2xl"] {
            will-change: transform;
            transform: translateZ(0);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(124, 58, 237, 0.25);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(124, 58, 237, 0.5);
        }

        /* Shimmer animation for loading states */
        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .animate-shimmer {
            animation: shimmer 2s linear infinite;
            background-size: 200% 100%;
        }
        
        /* Mobile Performance Optimizations */
        @media (max-width: 768px) {
            /* Disable heavy aurora animations on mobile */
            .aurora-blob {
                animation: none !important;
                filter: blur(60px) !important;
                opacity: 0.3 !important;
            }
            
            /* Reduce backdrop-filter intensity on mobile */
            [class*="backdrop-blur"] {
                -webkit-backdrop-filter: blur(8px) !important;
                backdrop-filter: blur(8px) !important;
            }
        }
        
        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            
            .aurora-blob {
                animation: none !important;
            }
        }
        
        /* Accessibility focus indicators */
        :focus-visible {
            outline: 2px solid #7c3aed;
            outline-offset: 2px;
        }
        
        /* Skip to content link */
        .skip-to-content {
            position: absolute;
            left: -9999px;
            z-index: 9999;
            padding: 1em;
            background-color: #7c3aed;
            color: white;
            text-decoration: none;
            font-weight: 600;
        }
        
        .skip-to-content:focus {
            left: 50%;
            transform: translateX(-50%);
            top: 0;
        }
    </style>
    <!-- Vite bundles dependencies; keep this legacy map inert for standalone previews. -->
    <script type="application/json" id="legacy-import-map">
            {
                "imports": {
                    "react": "https://aistudiocdn.com/react@^19.2.0/index.js",
                    "react-dom": "https://aistudiocdn.com/react-dom@^19.2.0/index.js",
                    "react-dom/client": "https://aistudiocdn.com/react-dom@^19.2.0/client.js",
                    "react-router-dom": "https://esm.sh/react-router-dom@6.22.3?external=react,react-dom",
                    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
                    "react/": "https://aistudiocdn.com/react@^19.2.0/"
                }
            }
        </script>
    <link rel="stylesheet" href="/styles.css" />
</head>

<body class="font-display antialiased overflow-x-hidden selection:bg-purple-500 selection:text-white">
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-to-content">Skip to main content</a>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
